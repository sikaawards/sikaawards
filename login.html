<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion -- SIKA AWARDS</title>
  <meta name="theme-color" content="#0A0A0A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css?v=1.0.1">
  <link rel="icon" type="image/png" href="assets/Fav Icon/SA-logo-Normal.png">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
      background: #050505;
      padding-top: 60px;
    }

    .login-box {
      background: rgba(20, 20, 20, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 25px 35px;
      width: 100%;
      max-width: 450px;
      text-align: center;
      position: relative;
      z-index: 10;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
      border-radius: 0;
    }

    .login-logo {
      height: 35px;
      margin-bottom: 15px;
      display: block;
      margin-left: auto;
      margin-right: auto;
      object-fit: contain;
    }

    .login-title {
      font-family: var(--font-heading);
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: #FFFFFF;
    }

    .login-subtitle {
      color: var(--text-muted);
      margin-bottom: 20px;
      font-size: 0.8rem;
      line-height: 1.4;
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #fff;
      color: #000;
      border: none;
      padding: 10px 16px;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 0;
    }

    .btn-google:hover {
      background: #f5f5f5;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .btn-google:active {
      transform: translateY(0);
    }

    .btn-google svg {
      width: 20px;
      height: 20px;
    }

    .login-error {
      color: var(--primary);
      margin-top: 20px;
      font-size: 0.85rem;
      display: none;
      padding: 12px;
      background: rgba(255, 51, 0, 0.1);
      border: 1px solid rgba(255, 51, 0, 0.3);
      border-radius: 0;
    }

    .back-link {
      position: absolute;
      top: 30px;
      left: 30px;
      color: var(--text-muted);
      text-decoration: none;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 2px;
      font-weight: 600;
      z-index: 10;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-link:hover {
      color: var(--primary);
      transform: translateX(-5px);
    }

    input {
      transition: all 0.3s ease;
      border-radius: 0;
    }

    input:focus {
      border-color: var(--primary) !important;
      box-shadow: 0 0 0 3px rgba(255, 51, 0, 0.1);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    @media (max-width: 768px) {
      .login-container {
        padding-top: 40px;
        padding: 15px;
      }

      .login-box {
        padding: 20px 20px;
        max-width: 100%;
      }

      .login-logo {
        height: 30px;
        margin-bottom: 12px;
      }

      .login-title {
        font-size: 1.5rem;
        margin-bottom: 4px;
      }

      .login-subtitle {
        font-size: 0.75rem;
        margin-bottom: 15px;
        line-height: 1.3;
      }

      .btn-google {
        padding: 10px 14px;
        font-size: 0.75rem;
      }

      .back-link {
        top: 15px;
        left: 15px;
        font-size: 0.65rem;
      }
    }
  </style>
</head>

<body>

  <a href="accueil.html" class="back-link">← Retour à l'accueil</a>

  <div class="login-container">
    <div class="login-box">
      <img src="assets/Logo_SA/SA-logo-Normal.png" alt="Sika Awards" class="login-logo">
      <h1 class="login-title">Connexion</h1>
      <p class="login-subtitle">Connectez-vous pour voter pour vos artistes préférés ou accéder à l'administration.</p>
      
      <button class="btn-google" id="btn-login-google">
        <svg viewBox="0 0 48 48" style="width:24px;height:24px;">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continuer avec Google
      </button>

      <div style="margin: 15px 0; display: flex; align-items: center; gap: 12px; opacity: 0.3;">
        <div style="flex:1; height:1px; background:#fff;"></div>
        <span style="font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px;">OU</span>
        <div style="flex:1; height:1px; background:#fff;"></div>
      </div>

      <form id="email-login-form" style="text-align: left;">
        <div style="margin-bottom: 12px;">
          <input type="email" id="login-email" placeholder="Email" required 
                 style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 10px; color: #fff; font-family: 'Inter', sans-serif;">
        </div>
        <div style="margin-bottom: 15px;">
          <input type="password" id="login-password" placeholder="Mot de passe" required 
                 style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 10px; color: #fff; font-family: 'Inter', sans-serif;">
        </div>
        <button type="submit" class="btn-google" style="background: var(--primary); color: #fff; border: none;">
          Se connecter
        </button>
      </form>

      <p style="margin-top: 12px; font-size: 0.75rem; color: var(--text-muted;">
        <a href="#" id="toggle-auth" style="color: var(--primary); text-decoration: none; font-weight: 600;">Pas encore de compte ? S'inscrire</a>
      </p>

      <p class="login-error" id="error-msg"></p>
    </div>
  </div>

  <script type="module">
    import { auth, provider, signInWithPopup, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword, ADMIN_EMAILS } from './scripts/firebase-config.js?v=3';

    const btnGoogle = document.getElementById('btn-login-google');
    const emailForm = document.getElementById('email-login-form');
    const errorMsg = document.getElementById('error-msg');
    const toggleBtn = document.getElementById('toggle-auth');
    const loginTitle = document.querySelector('.login-title');
    const loginSubtitle = document.querySelector('.login-subtitle');
    const submitBtn = emailForm.querySelector('button');

    let isLoginMode = true;

    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect') || 'accueil.html';

    async function handleAuthSuccess(user) {
      if (redirectUrl.includes('admin.html')) {
        if (!ADMIN_EMAILS.includes(user.email)) {
          errorMsg.textContent = "Accès refusé : vous n'êtes pas administrateur.";
          errorMsg.style.display = 'block';
          await signOut(auth);
          return false;
        }
      }
      window.location.href = redirectUrl;
      return true;
    }

    // Toggle entre login et inscription
    toggleBtn.addEventListener('click', () => {
      isLoginMode = !isLoginMode;
      if (isLoginMode) {
        loginTitle.textContent = 'Connexion';
        loginSubtitle.textContent = 'Connectez-vous pour voter pour vos artistes préférés ou accéder à l\'administration.';
        submitBtn.textContent = 'Se connecter';
        toggleBtn.textContent = 'Pas encore de compte ? S\'inscrire';
      } else {
        loginTitle.textContent = 'Inscription';
        loginSubtitle.textContent = 'Créez un compte pour voter pour vos artistes préférés.';
        submitBtn.textContent = 'S\'inscrire';
        toggleBtn.textContent = 'Déjà un compte ? Se connecter';
      }
      errorMsg.style.display = 'none';
    });

    // Login Google
    btnGoogle.addEventListener('click', async () => {
      try {
        btnGoogle.disabled = true;
        btnGoogle.style.opacity = '0.5';
        const result = await signInWithPopup(auth, provider);
        await handleAuthSuccess(result.user);
      } catch (error) {
        console.error(error);
        errorMsg.textContent = "Erreur de connexion Google.";
        errorMsg.style.display = 'block';
        btnGoogle.disabled = false;
        btnGoogle.style.opacity = '1';
      }
    });

    // Login/Inscription Email
    emailForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      const btn = emailForm.querySelector('button');

      try {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        errorMsg.style.display = 'none';

        if (isLoginMode) {
          const result = await signInWithEmailAndPassword(auth, email, pass);
          await handleAuthSuccess(result.user);
        } else {
          const result = await createUserWithEmailAndPassword(auth, email, pass);
          await handleAuthSuccess(result.user);
        }
      } catch (error) {
        console.error(error);
        if (isLoginMode) {
          errorMsg.textContent = "Email ou mot de passe incorrect. Assurez-vous d'avoir activé ce mode dans Firebase.";
        } else {
          errorMsg.textContent = "Erreur lors de l'inscription. Cet email est peut-être déjà utilisé.";
        }
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    });
  </script>
</body>
</html>
