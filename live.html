<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live - SIKA AWARDS</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 100px 20px 40px;
    }

    .live-container {
      max-width: 1600px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      align-items: stretch;
    }

    .video-wrapper {
      background: #000;
      border-radius: 0;
      overflow: hidden;
      position: relative;
      aspect-ratio: 16/9;
      max-height: 70vh;
    }

    .video-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .video-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .video-black-bar {
      position: absolute;
      left: 0;
      right: 0;
      height: 60px;
      background: #000;
      z-index: 5;
      transition: opacity 0.3s ease;
    }

    @media (max-width: 768px) {
      .video-black-bar {
        height: 30px;
      }

      .custom-controls {
        height: 30px !important;
        padding: 0 6px;
        gap: 4px;
      }

      .control-btn {
        padding: 2px;
        height: 24px;
        width: 24px;
      }

      .control-btn svg {
        width: 16px;
        height: 16px;
      }

      .volume-container {
        gap: 4px;
      }

      .volume-slider {
        width: 35px;
        height: 2px;
      }

      .volume-slider::-webkit-slider-thumb {
        width: 8px;
        height: 8px;
      }

      .resolution-select {
        font-size: 8px;
        padding: 1px 3px;
        height: 20px;
      }

      .progress-bar {
        bottom: 30px;
        height: 2px;
      }
    }

    .video-black-bar.top {
      top: 0;
    }

    .video-black-bar.bottom {
      bottom: 0;
    }

    .video-black-bar.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .custom-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 15px;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .custom-controls.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .control-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .control-btn:hover {
      transform: scale(1.1);
    }

    .control-btn svg {
      width: 24px;
      height: 24px;
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .volume-slider {
      width: 80px;
      height: 4px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: #ff6600;
      border-radius: 50%;
      cursor: pointer;
    }

    .resolution-select {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }

    .resolution-select option {
      background: #000;
      color: #fff;
    }

    .progress-bar {
      position: absolute;
      bottom: 60px;
      left: 0;
      right: 0;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .progress-bar.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .progress-bar-fill {
      height: 100%;
      background: #ff6600;
      width: 0%;
      transition: width 0.1s linear;
    }

    .video-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
    }

    .back-button {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 16px;
      border-radius: 0;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    .chat-panel {
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0;
      padding: 10px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      max-height: 70vh;
    }

    .chat-header {
      padding: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-title {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }

    .chat-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      padding: 0;
      width: 30px;
      height: 30px;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 0;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      min-height: 0;
    }

    .chat-messages::-webkit-scrollbar {
      width: 4px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255, 51, 0, 0.5);
      border-radius: 2px;
    }

    .chat-message {
      margin-bottom: 12px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 0;
    }

    .chat-message.system {
      background: rgba(255, 51, 0, 0.1);
      border-left: 3px solid #ff3300;
    }

    .chat-username {
      font-weight: 600;
      color: #ff6600;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .chat-text {
      color: #ccc;
      font-size: 14px;
      line-height: 1.4;
    }

    .chat-input-container {
      padding: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 12px 16px;
      border-radius: 0;
      font-size: 14px;
      outline: none;
    }

    .chat-input:focus {
      border-color: #ff6600;
    }

    .chat-send {
      background: #ff6600;
      border: none;
      color: #fff;
      width: 45px;
      height: 45px;
      border-radius: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .chat-send:hover {
      background: #ff7733;
      transform: scale(1.05);
    }

    .chat-send svg {
      width: 20px;
      height: 20px;
    }

    @media (max-width: 768px) {
      body {
        padding: 80px 15px 30px;
      }

      .live-container {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .video-wrapper {
        max-height: 50vh;
      }

      .chat-panel {
        width: 100%;
        height: 400px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 70px 10px 20px;
      }

      .video-wrapper {
        max-height: 40vh;
      }

      .back-button {
        padding: 10px 20px;
        font-size: 12px;
      }

      .live-indicator {
        font-size: 10px;
        padding: 6px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="live-container">
    <div class="video-wrapper">
      <div class="video-overlay">
        <a href="compte.html" class="back-button">← Retour</a>
      </div>
      <div class="video-container" id="video-container">
        <div id="live-placeholder" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #888;">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 60px; height: 60px; margin-bottom: 20px;">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10 8L16 12L10 16V8Z" fill="currentColor"/>
          </svg>
          <div id="placeholder-text">Chargement...</div>
        </div>
      </div>
      <div class="video-black-bar top" id="top-bar"></div>
      <div class="video-black-bar bottom" id="bottom-bar"></div>
      <div class="progress-bar" id="progress-bar">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="custom-controls" id="custom-controls">
        <button class="control-btn" id="play-pause-btn">
          <svg viewBox="0 0 24 24" fill="currentColor" id="play-icon">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg viewBox="0 0 24 24" fill="currentColor" id="pause-icon" style="display: none;">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        </button>
        <div class="volume-container">
          <button class="control-btn" id="mute-btn">
            <svg viewBox="0 0 24 24" fill="currentColor" id="volume-icon">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <svg viewBox="0 0 24 24" fill="currentColor" id="mute-icon" style="display: none;">
              <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
          </button>
          <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="100">
        </div>
        <select class="resolution-select" id="resolution-select">
          <option value="auto">Auto</option>
          <option value="1080">1080p</option>
          <option value="720">720p</option>
          <option value="480">480p</option>
          <option value="360">360p</option>
        </select>
        <button class="control-btn" id="fullscreen-btn">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="chat-panel" id="chat-panel">
      <div class="chat-header">
        <div class="chat-title">Chat en direct</div>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="chat-message system">
          <div class="chat-username">Système</div>
          <div class="chat-text">Bienvenue sur le chat SIKA AWARDS !</div>
        </div>
      </div>
      <div class="chat-input-container">
        <input type="text" class="chat-input" id="chat-input" placeholder="Écrivez votre message..." maxlength="200">
        <button class="chat-send" id="btn-send">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="scripts/main.js" defer></script>

  <script type="module">
    import { auth, onAuthStateChanged, db, doc, getDoc, setDoc, addDoc, collection, onSnapshot, query, orderBy, limit } from './scripts/firebase-config.js';

    let currentUser = null;
    let username = '';
    let liveStreamUrl = '';
    let chatUnsubscribe = null;
    let player = null;
    let isPlaying = false;
    let isMuted = false;
    let currentVolume = 100;
    let controlsTimeout = null;

    // Custom controls
    const topBar = document.getElementById('top-bar');
    const bottomBar = document.getElementById('bottom-bar');
    const customControls = document.getElementById('custom-controls');
    const progressBar = document.getElementById('progress-bar');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const muteBtn = document.getElementById('mute-btn');
    const volumeIcon = document.getElementById('volume-icon');
    const muteIcon = document.getElementById('mute-icon');
    const volumeSlider = document.getElementById('volume-slider');
    const resolutionSelect = document.getElementById('resolution-select');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const videoWrapper = document.querySelector('.video-wrapper');

    // Show/hide controls on hover
    videoWrapper.addEventListener('mouseenter', showControls);
    videoWrapper.addEventListener('mousemove', () => {
      showControls();
      clearTimeout(controlsTimeout);
      controlsTimeout = setTimeout(hideControls, 6000);
    });

    // Also handle mousemove on document for fullscreen
    document.addEventListener('mousemove', (e) => {
      if (document.fullscreenElement) {
        showControls();
        clearTimeout(controlsTimeout);
        controlsTimeout = setTimeout(hideControls, 6000);
      }
    });

    function showControls() {
      topBar.classList.remove('hidden');
      bottomBar.classList.remove('hidden');
      customControls.classList.remove('hidden');
      progressBar.classList.remove('hidden');
    }

    function hideControls() {
      if (isPlaying) {
        topBar.classList.add('hidden');
        bottomBar.classList.add('hidden');
        customControls.classList.add('hidden');
        progressBar.classList.add('hidden');
      }
    }

    // Play/Pause
    playPauseBtn.addEventListener('click', togglePlayPause);

    function togglePlayPause() {
      if (player && player.playVideo) {
        if (isPlaying) {
          player.pauseVideo();
          isPlaying = false;
          playIcon.style.display = 'block';
          pauseIcon.style.display = 'none';
        } else {
          player.playVideo();
          isPlaying = true;
          playIcon.style.display = 'none';
          pauseIcon.style.display = 'block';
          showControls();
          clearTimeout(controlsTimeout);
          controlsTimeout = setTimeout(hideControls, 3000);
        }
      }
    }

    // Volume
    muteBtn.addEventListener('click', toggleMute);
    volumeSlider.addEventListener('input', (e) => {
      currentVolume = e.target.value;
      if (player && player.setVolume) {
        player.setVolume(currentVolume);
      }
      if (currentVolume == 0) {
        isMuted = true;
        volumeIcon.style.display = 'none';
        muteIcon.style.display = 'block';
      } else {
        isMuted = false;
        volumeIcon.style.display = 'block';
        muteIcon.style.display = 'none';
      }
    });

    function toggleMute() {
      if (player && player.setVolume) {
        if (isMuted) {
          player.setVolume(currentVolume);
          isMuted = false;
          volumeIcon.style.display = 'block';
          muteIcon.style.display = 'none';
          volumeSlider.value = currentVolume;
        } else {
          player.setVolume(0);
          isMuted = true;
          volumeIcon.style.display = 'none';
          muteIcon.style.display = 'block';
          volumeSlider.value = 0;
        }
      }
    }

    // Resolution
    resolutionSelect.addEventListener('change', (e) => {
      if (player && player.setPlaybackQuality) {
        const quality = e.target.value === 'auto' ? 'default' : e.target.value;
        player.setPlaybackQuality(quality);
      }
    });

    // Fullscreen
    fullscreenBtn.addEventListener('click', toggleFullscreen);

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        videoWrapper.requestFullscreen().catch(err => {
          console.log('Erreur fullscreen:', err);
        });
      } else {
        document.exitFullscreen();
      }
    }

    // Fullscreen change events
    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        showControls();
        clearTimeout(controlsTimeout);
        controlsTimeout = setTimeout(hideControls, 6000);
      }
    });

    // Progress bar click
    progressBar.addEventListener('click', (e) => {
      if (player && player.seekTo && player.getDuration) {
        const rect = progressBar.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const percentage = clickX / rect.width;
        const duration = player.getDuration();
        const seekTime = percentage * duration;
        player.seekTo(seekTime, true);
      }
    });

    // Load YouTube IFrame API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    window.onYouTubeIframeAPIReady = function() {
      console.log('YouTube API prête');
    };

    // Vérification de l'authentification
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html?redirect=live.html';
        return;
      }

      currentUser = user;
      console.log('Utilisateur authentifié:', user.email);
      
      try {
        await loadUsername();
        await loadStreamConfig();
        initLivePlayer(liveStreamUrl);
        initChat();
        console.log('Initialisation live terminée avec succès');
      } catch (error) {
        console.error('Erreur lors de l\'initialisation live:', error);
        alert('Erreur lors du chargement du live. Veuillez rafraîchir la page.');
      }
    });

    async function loadUsername() {
      try {
        console.log('Chargement username pour utilisateur:', currentUser.uid);
        const userDoc = await getDoc(doc(db, 'users', currentUser.uid));
        if (userDoc.exists()) {
          username = userDoc.data().username || currentUser.email.split('@')[0];
          console.log('Username chargé depuis Firestore:', username);
        } else {
          username = currentUser.email.split('@')[0];
          console.log('Username par défaut:', username);
          await setDoc(doc(db, 'users', currentUser.uid), {
            email: currentUser.email,
            username: username,
            createdAt: new Date().toISOString()
          });
        }
      } catch (error) {
        console.error('Erreur chargement username:', error);
        username = currentUser.email.split('@')[0];
      }
    }

    async function loadStreamConfig() {
      try {
        const configDoc = await getDoc(doc(db, 'config', 'live'));
        if (configDoc.exists()) {
          liveStreamUrl = configDoc.data().streamUrl || '';
        }
        if (!liveStreamUrl) {
          liveStreamUrl = 'https://www.youtube.com/live/TWxYNCxG9AQ?feature=share';
        }
      } catch (error) {
        console.error('Erreur chargement config stream:', error);
        liveStreamUrl = 'https://www.youtube.com/live/TWxYNCxG9AQ?feature=share';
      }
    }

    function initLivePlayer(streamUrl) {
      const placeholder = document.getElementById('live-placeholder');
      const placeholderText = document.getElementById('placeholder-text');
      const videoContainer = document.getElementById('video-container');

      console.log('Initialisation du lecteur avec URL:', streamUrl);

      if (!streamUrl) {
        console.log('Aucun URL de stream fourni');
        return;
      }

      const youtubeMatch = streamUrl.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|live\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
      console.log('Résultat matching YouTube:', youtubeMatch);

      if (youtubeMatch) {
        console.log('URL YouTube détectée');
        const videoId = youtubeMatch[1];
        console.log('Video ID extrait:', videoId);

        // Remove existing iframe if any
        const existingIframe = videoContainer.querySelector('iframe');
        if (existingIframe) {
          existingIframe.remove();
        }

        // Create div for YouTube player
        const playerDiv = document.createElement('div');
        playerDiv.id = 'youtube-player';
        playerDiv.style.width = '100%';
        playerDiv.style.height = '100%';
        playerDiv.style.position = 'absolute';
        playerDiv.style.top = '0';
        playerDiv.style.left = '0';
        videoContainer.appendChild(playerDiv);

        // Initialize YouTube player with API
        if (window.YT && window.YT.Player) {
          createYouTubePlayer(videoId);
        } else {
          // Wait for API to load
          const checkAPI = setInterval(() => {
            if (window.YT && window.YT.Player) {
              clearInterval(checkAPI);
              createYouTubePlayer(videoId);
            }
          }, 100);
        }

        placeholder.style.display = 'none';
      } else {
        placeholderText.textContent = 'Aucun stream disponible';
      }
    }

    function createYouTubePlayer(videoId) {
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      
      player = new YT.Player('youtube-player', {
        videoId: videoId,
        playerVars: {
          autoplay: 1,
          modestbranding: 1,
          controls: 0,
          rel: 0,
          showinfo: 0,
          iv_load_policy: 3,
          disablekb: 1,
          fs: 0,
          playsinline: isMobile ? 1 : 0,
          enablejsapi: 1,
          mute: isMobile ? 1 : 0
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      console.log('Lecteur YouTube prêt');
      isPlaying = true;
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
      
      // Update progress bar
      updateProgress();
      setInterval(updateProgress, 1000);
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
      } else if (event.data === YT.PlayerState.PAUSED) {
        isPlaying = false;
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    }

    function updateProgress() {
      if (player && player.getCurrentTime && player.getDuration) {
        const currentTime = player.getCurrentTime();
        const duration = player.getDuration();
        if (duration > 0) {
          const progress = (currentTime / duration) * 100;
          document.getElementById('progress-fill').style.width = progress + '%';
        }
      }
    }

    function initChat() {
      try {
        const chatQuery = query(
          collection(db, 'chat_messages'),
          orderBy('timestamp', 'asc'),
          limit(50)
        );
        
        console.log('Chat initialisé avec Firestore');
        
        chatUnsubscribe = onSnapshot(chatQuery, (snapshot) => {
          const chatMessages = document.getElementById('chat-messages');
          chatMessages.innerHTML = '';
          
          snapshot.forEach((doc) => {
            const message = doc.data();
            console.log('Message reçu:', message);
            addChatMessage(message.username, message.text, message.timestamp);
          });
          
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }, (error) => {
          console.error('Erreur écoute chat:', error);
        });
      } catch (error) {
        console.error('Erreur initialisation chat:', error);
      }
    }

    function addChatMessage(messageUsername, messageText, timestamp) {
      const chatMessages = document.getElementById('chat-messages');
      const messageDiv = document.createElement('div');
      messageDiv.className = 'chat-message';
      
      const usernameSpan = document.createElement('span');
      usernameSpan.className = 'chat-username';
      usernameSpan.textContent = messageUsername + ':';
      
      const textSpan = document.createElement('span');
      textSpan.className = 'chat-text';
      textSpan.textContent = messageText;
      
      messageDiv.appendChild(usernameSpan);
      messageDiv.appendChild(textSpan);
      
      chatMessages.appendChild(messageDiv);
    }

    document.getElementById('btn-send').addEventListener('click', sendMessage);
    document.getElementById('chat-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    function sendMessage() {
      const chatInput = document.getElementById('chat-input');
      const messageText = chatInput.value.trim();
      
      if (messageText === '') return;
      
      if (!username) {
        alert('Username non chargé. Veuillez rafraîchir la page.');
        return;
      }
      
      const message = {
        username: username,
        text: messageText,
        timestamp: Date.now(),
        userId: currentUser.uid
      };
      
      console.log('Envoi du message:', message);
      
      try {
        addDoc(collection(db, 'chat_messages'), message)
          .then(() => {
            console.log('Message envoyé avec succès');
            chatInput.value = '';
          })
          .catch((error) => {
            console.error('Erreur envoi message:', error);
            alert('Erreur lors de l\'envoi du message: ' + error.message);
          });
      } catch (error) {
        console.error('Erreur envoi message:', error);
        alert('Erreur lors de l\'envoi du message: ' + error.message);
      }
    }

    document.getElementById('btn-refresh').addEventListener('click', () => {
      loadStreamConfig().then(() => {
        initLivePlayer(liveStreamUrl);
      });
    });
  </script>
</body>
</html>
