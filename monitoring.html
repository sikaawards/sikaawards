<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring -- SIKA AWARDS</title>
  <meta name="theme-color" content="#0A0A0A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css?v=1.0.4">
  <link rel="icon" type="image/png" href="assets/Fav Icon/SA-logo-Normal.png">
  <style>
    body {
      background: #050505;
      color: #fff;
      min-height: 100vh;
      padding: 80px 24px 24px;
    }

    .monitoring-header {
      margin-bottom: 40px;
    }

    .monitoring-title {
      font-family: var(--font-heading);
      font-size: 2.5rem;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .monitoring-subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 0;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .stat-value {
      font-family: var(--font-heading);
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--primary);
    }

    .category-stats {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 24px;
      margin-bottom: 20px;
    }

    .category-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: 0.3s;
    }

    .category-row:hover {
      background: rgba(255, 126, 95, 0.05);
      padding-left: 8px;
      padding-right: 8px;
    }

    .category-row:last-child {
      border-bottom: none;
    }

    .category-name {
      font-weight: 600;
    }

    .category-arrow {
      font-size: 0.8rem;
      color: var(--primary);
      transition: 0.3s;
    }

    .category-row.expanded .category-arrow {
      transform: rotate(180deg);
    }

    .category-detail {
      display: none;
      padding: 12px 0;
      background: rgba(255, 126, 95, 0.03);
      margin: 8px 0;
      border-left: 3px solid var(--primary);
      padding-left: 16px;
    }

    .category-detail.show {
      display: block;
    }

    .nominee-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .nominee-item:last-child {
      border-bottom: none;
    }

    .category-votes {
      font-family: var(--font-heading);
      font-weight: 700;
      color: var(--primary);
    }

    .refresh-btn {
      background: var(--primary);
      border: none;
      color: #fff;
      padding: 12px 24px;
      font-family: var(--font-heading);
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.3s;
      margin-bottom: 20px;
    }

    .refresh-btn:hover {
      background: var(--primary-light);
    }

    .last-updated {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 10px;
    }

    @media (max-width: 768px) {
      body {
        padding: 60px 16px 16px;
      }

      .monitoring-title {
        font-size: 1.8rem;
      }

      .monitoring-subtitle {
        font-size: 0.8rem;
      }

      .stats-grid {
        grid-template-columns: 1fr;
        gap: 12px;
        margin-bottom: 24px;
      }

      .stat-card {
        padding: 16px;
      }

      .stat-value {
        font-size: 2rem;
      }

      .category-stats {
        padding: 16px;
        margin-bottom: 16px;
      }

      .category-stats h2 {
        font-size: 1.2rem;
        margin-bottom: 16px;
      }

      .category-row {
        padding: 10px 0;
        font-size: 0.9rem;
      }

      .category-row:hover {
        padding-left: 4px;
        padding-right: 4px;
      }

      .category-name {
        font-size: 0.85rem;
      }

      .category-votes {
        font-size: 0.85rem;
      }

      .category-arrow {
        font-size: 0.7rem;
      }

      .category-detail {
        padding: 10px 0;
        padding-left: 12px;
        margin: 6px 0;
      }

      .nominee-item {
        padding: 8px 0;
        font-size: 0.85rem;
      }

      .nominee-item div:first-child div:first-child {
        font-size: 0.85rem;
      }

      .nominee-item div:first-child div:last-child {
        font-size: 0.65rem;
      }

      .nominee-item div:last-child {
        font-size: 0.85rem;
      }

      .refresh-btn {
        padding: 10px 20px;
        font-size: 0.85rem;
        margin-bottom: 16px;
      }

      .last-updated {
        font-size: 0.7rem;
      }
    }

    @media (max-width: 480px) {
      .monitoring-title {
        font-size: 1.5rem;
      }

      .stat-value {
        font-size: 1.8rem;
      }

      .category-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .category-row div {
        width: 100%;
        justify-content: space-between;
      }

      .category-name {
        font-size: 0.8rem;
      }

      .category-votes {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="monitoring-header">
    <h1 class="monitoring-title">Monitoring Votes</h1>
    <p class="monitoring-subtitle">Surveillance en temps réel des votes</p>
  </div>

  <button class="refresh-btn" onclick="window.location.reload()">Rafraîchir</button>
  <button class="refresh-btn" onclick="window.downloadUsersCSV()" style="background: #4CAF50; margin-left: 10px;">Télécharger Emails</button>
  <p class="last-updated" id="last-updated">Dernière mise à jour: --</p>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total Votes</div>
      <div class="stat-value" id="total-votes">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Catégories</div>
      <div class="stat-value" id="total-categories">0</div>
    </div>
  </div>

  <div class="category-stats">
    <h2 style="font-family: var(--font-heading); font-size: 1.5rem; font-weight: 700; margin-bottom: 20px;">Votes par Catégorie</h2>
    <div id="category-votes-list">
      <p style="color: var(--text-muted);">Chargement...</p>
    </div>
  </div>



  <script type="module">
    import { db, collection, getDocs, doc, getDoc } from './scripts/firebase-config.js?v=6';

    async function loadMonitoringData() {
      try {
        const snap = await getDocs(collection(db, "categories"));
        const categories = snap.docs.map(d => ({ ...d.data(), id: d.id }));
        categories.sort((a, b) => parseInt(a.num) - parseInt(b.num));

        let totalVotes = 0;
        const categoryVotes = [];

        categories.forEach(cat => {
          const catVotes = (cat.nominees || []).reduce((sum, n) => sum + (n.votes || 0), 0);
          totalVotes += catVotes;
          categoryVotes.push({
            title: cat.title,
            num: cat.num,
            votes: catVotes,
            nominees: cat.nominees || []
          });
        });

        document.getElementById('total-votes').textContent = totalVotes;
        document.getElementById('total-categories').textContent = categories.length;

        const listHtml = categoryVotes.map((cat, index) => `
          <div class="category-row" onclick="window.toggleCategory(${index})">
            <span class="category-name">${cat.num} - ${cat.title}</span>
            <div style="display: flex; align-items: center; gap: 12px;">
              <span class="category-votes">${cat.votes} votes</span>
              <span class="category-arrow">▼</span>
            </div>
          </div>
          <div class="category-detail" id="category-detail-${index}">
            ${cat.nominees.map(nominee => `
              <div class="nominee-item">
                <div>
                  <div style="font-weight: 600;">${nominee.name}</div>
                  <div style="font-size: 0.7rem; color: var(--text-muted);">${nominee.sub || ''}</div>
                </div>
                <div style="font-family: var(--font-heading); font-weight: 700; color: var(--primary);">${nominee.votes || 0} votes</div>
              </div>
            `).join('')}
          </div>
        `).join('');

        document.getElementById('category-votes-list').innerHTML = listHtml;

        const now = new Date();
        document.getElementById('last-updated').textContent = `Dernière mise à jour: ${now.toLocaleTimeString('fr-FR')}`;
      } catch (error) {
        console.error('Erreur chargement monitoring:', error);
        document.getElementById('category-votes-list').innerHTML = '<p style="color: #ff4444;">Erreur de chargement</p>';
      }
    }

    // Charger au démarrage
    loadMonitoringData();

    // Rafraîchir automatiquement toutes les 30 secondes
    setInterval(loadMonitoringData, 30000);
  </script>

  <script>
    function toggleCategory(index) {
      const row = document.querySelectorAll('.category-row')[index];
      const detail = document.getElementById(`category-detail-${index}`);
      
      row.classList.toggle('expanded');
      detail.classList.toggle('show');
    }

    async function downloadUsersCSV() {
      try {
        const { db, collection, getDocs } = await import('./scripts/firebase-config.js?v=6');
        const snap = await getDocs(collection(db, "users"));
        const usersList = snap.docs.map(d => ({ ...d.data(), id: d.id }));

        // Créer le contenu CSV
        const csvContent = "Email,Date d'inscription\n" + usersList.map(user => {
          const date = user.createdAt ? new Date(user.createdAt).toLocaleString('fr-FR') : 'Inconnu';
          return `"${user.email}","${date}"`;
        }).join('\n');

        // Créer le blob et le télécharger
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        
        link.setAttribute('href', url);
        link.setAttribute('download', `utilisateurs_${new Date().toISOString().split('T')[0]}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (error) {
        console.error('Erreur téléchargement CSV:', error);
        alert('Erreur lors du téléchargement des emails');
      }
    }
  </script>
  <script src="scripts/navbar.js?v=1.0.1" defer></script>
  <script type="module" src="scripts/auth-ui.js" defer></script>
</body>
</html>
